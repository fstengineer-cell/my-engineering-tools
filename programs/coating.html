<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Engineering Tools Suite</title>
    
    <script src="tailwindcss.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- 1. CORE THEME --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Prompt', sans-serif;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            color: #2d3748;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1100px;
        }

        .card-container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        /* Animation เฉพาะการกระพริบเตือนที่สาร Coating */
        @keyframes pulse-highlight {
            0% { border-color: #60a5fa; box-shadow: 0 0 0 0px rgba(37, 99, 235, 0.4); }
            50% { border-color: #2563eb; box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); background-color: #fffbeb; }
            100% { border-color: #60a5fa; box-shadow: 0 0 0 0px rgba(37, 99, 235, 0); }
        }

        .needs-attention {
            animation: pulse-highlight 1.5s infinite;
            border-width: 3px !important;
        }

        header {
            padding: 20px;
            text-align: center;
            color: white;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        header h2 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .header-controls {
            display: flex; justify-content: center; gap: 10px; padding: 10px 20px;
            background: #f8fafc; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap;
        }

        .content { padding: 25px; }

        .input-grid-wrapper { display: grid; grid-template-columns: 1fr 1.5fr; gap: 25px; margin-bottom: 20px; }

        @media (max-width: 800px) { .input-grid-wrapper { grid-template-columns: 1fr; } }

        .form-section-card {
            background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; 
            display: flex; flex-direction: column; justify-content: center;
        }

        label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 12px; font-size: 0.95rem; }

        select, input { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; font-family: inherit; transition: all 0.2s ease; }

        #coatingSelect { font-weight: 600; color: #1e40af; background-color: #eff6ff; cursor: pointer; }

        .detail-work-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 15px; background: #f7fafc; padding: 15px; border-radius: 12px; border: 2px solid #edf2f7; }

        .tol-stack { display: flex; flex-direction: column; gap: 10px; }
        .tol-input-group label { font-size: 0.8rem; margin-bottom: 2px; color: #718096; }

        /* --- 3. STATUS & RESULTS --- */
        .status-bar { padding: 15px; border-radius: 10px; margin-bottom: 25px; text-align: center; font-weight: 600; display: none; line-height: 1.5; }
        .status-ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .status-wide { background: #f3e8ff; color: #6b21a8; border: 1px solid #d8b4fe; } 
        .status-warn { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
        .status-err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        .results-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .result-column { background: #fff; border-radius: 15px; border: 1px solid #e2e8f0; overflow: hidden; transition: opacity 0.3s ease; }
        .result-column.faded { opacity: 0.3; filter: grayscale(100%); pointer-events: none; }

        .res-header { padding: 10px; text-align: center; color: white; font-weight: 700; text-transform: uppercase; }
        .res-normal { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); }
        .res-precision { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); }

        .result-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin: 15px; text-align: center; }

        .drawing-dia { font-size: 2rem; font-weight: 700; }
        .drawing-tol-stack { display: flex; flex-direction: column; font-size: 1rem; font-weight: 600; text-align: left; }

        .btn-action { padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; }
        .btn-reset { background: #fee2e2; color: #991b1b; }
        .btn-save { width: 100%; padding: 12px; background: #2563eb; color: white; border-radius: 10px; margin-top: 10px; border:none; cursor: pointer;}
        .toggle-btn { background: none; border: none; color: #718096; cursor: pointer; font-size: 0.9rem; text-decoration: underline; margin-top: 15px; width: 100%; }
        
        .coating-info { font-size: 0.85rem; color: #4a5568; margin-top: 15px; padding: 12px; background: #f7fafc; border: 1px dashed #cbd5e1; border-radius: 8px; line-height: 1.6; }

        /* =========================================
           Mobile Fix: ปรับขนาดตัวเลขผลลัพธ์ไม่ให้ล้นกรอบ
           ========================================= */
        @media (max-width: 600px) {
            /* 1. ลดขนาดตัวเลขหลัก (เช่น 16.792) */
            .drawing-dia { 
                font-size: 1.35rem !important; 
            }
            
            /* 2. ลดขนาดตัวเลข Tolerance (+0.0 / -0.0) */
            .drawing-tol-stack { 
                font-size: 0.75rem !important; 
            }
            
            /* 3. ลดช่องว่างระหว่างตัวเลขหลักและ Tol */
            .drawing-display { 
                gap: 4px !important; 
            }
            
            /* 4. ลด Padding และ Margin ของการ์ด เพื่อเพิ่มพื้นที่ด้านใน */
            .result-card { 
                padding: 10px 5px !important; 
                margin: 10px 8px !important; 
            }
            
            /* 5. ลดขนาดหัวข้อ TARGET: MIN/MAX */
            .res-title { 
                font-size: 0.65rem !important; 
                letter-spacing: 0px !important;
            }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="card-container">
        <header>
            <h2>🛡️ Pre-Coating Calculator</h2>
        </header>
        
        <div class="header-controls">
            <span class="last-update" id="lastUpdateDisplay" style="font-size: 0.75rem; color: #a0aec0; margin-right: auto; align-self: center;">Update: -</span>
            <button class="btn-action btn-reset" onclick="resetDefaults()">↻ Factory Reset</button>
            <button class="btn-action" style="background:#dcfce7; color:#166534;" onclick="exportData()">⬇ Export</button>
            <button class="btn-action" style="background:#dbeafe; color:#1e40af;" onclick="document.getElementById('fileInput').click()">⬆ Import</button>
            <input type="file" id="fileInput" style="display: none" accept=".json" onchange="importData(this)">
        </div>

        <div class="content">
            <div class="input-grid-wrapper">
                <div class="form-section-card">
                    <div class="form-group">
                        <label>
                            <div>เลือกสาร Coating <span id="countDisplay" style="font-size:0.8rem; color:#2563eb;">(0)</span></div>
                            <button id="btnDelete" style="color:#e53e3e; background:none; border:none; cursor:pointer; font-size:0.8rem;" onclick="deleteCurrentCoating()">ลบ</button>
                        </label>
                        <select id="coatingSelect" onchange="handleCoatingChange()" class="needs-attention"></select>
                        <div id="coatingRangeDisplay" class="coating-info">โปรดเลือกสารเพื่อดูช่วงความหนา</div>
                    </div>
                </div>

                <div class="form-section-card">
                    <div class="form-group">
                        <label>Dimensions & Tolerances</label>
                        <div class="detail-work-grid">
                            <div>
                                <label style="font-size:0.75rem;">Target Dia (mm)</label>
                                <input type="number" id="baseDia" step="0.001" placeholder="10.00" oninput="calculate()" style="height: 50px; font-size: 1.2rem; font-weight:bold;">
                            </div>
                            <div class="tol-stack">
                                <div class="tol-input-group">
                                    <label>Max</label>
                                    <input type="number" id="tolUpper" step="0.001" placeholder="0.020" oninput="calculate()">
                                </div>
                                <div class="tol-input-group">
                                    <label>Min</label>
                                    <input type="number" id="tolLower" step="0.001" placeholder="-0.010" oninput="calculate()">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="statusDisplay" class="status-bar">รอข้อมูล...</div>

            <div class="results-wrapper">
                <div class="result-column" id="colNormal">
                    <div class="res-header res-normal">Normal Type</div>
                    <div class="result-card">
                        <div style="font-size:0.7rem; color:#718096; margin-bottom:5px;">TARGET: MIN (TOL -)</div>
                        <div style="display:flex; justify-content:center; align-items:center; gap:10px;">
                            <div class="drawing-dia" id="norm_neg_base">-</div>
                            <div class="drawing-tol-stack">
                                <div id="norm_neg_top">-</div>
                                <div id="norm_neg_bot">-</div>
                            </div>
                        </div>
                    </div>
                    <div class="result-card">
                        <div style="font-size:0.7rem; color:#718096; margin-bottom:5px;">TARGET: MAX (TOL +)</div>
                        <div style="display:flex; justify-content:center; align-items:center; gap:10px;">
                            <div class="drawing-dia" id="norm_pos_base">-</div>
                            <div class="drawing-tol-stack">
                                <div id="norm_pos_top">-</div>
                                <div id="norm_pos_bot">-</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="result-column" id="colPrecision">
                    <div class="res-header res-precision">Precision Type</div>
                    <div class="result-card">
                        <div style="font-size:0.7rem; color:#718096; margin-bottom:5px;">TARGET: MIN (TOL -)</div>
                        <div style="display:flex; justify-content:center; align-items:center; gap:10px;">
                            <div class="drawing-dia" id="prec_neg_base">-</div>
                            <div class="drawing-tol-stack">
                                <div id="prec_neg_top">-</div>
                                <div id="prec_neg_bot">-</div>
                            </div>
                        </div>
                    </div>
                    <div class="result-card">
                        <div style="font-size:0.7rem; color:#718096; margin-bottom:5px;">TARGET: MAX (TOL +)</div>
                        <div style="display:flex; justify-content:center; align-items:center; gap:10px;">
                            <div class="drawing-dia" id="prec_pos_base">-</div>
                            <div class="drawing-tol-stack">
                                <div id="prec_pos_top">-</div>
                                <div id="prec_pos_bot">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="toggle-btn" onclick="toggleAddForm()">+ เพิ่มสาร Coating ใหม่</button>
            <div id="addCoatingForm" style="display:none; background:#f1f5f9; padding:20px; border-radius:12px; margin-top:10px; border: 1px solid #cbd5e1;">
                <input type="text" id="new_name" placeholder="ชื่อสาร (Name)" style="margin-bottom:10px;">
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <input type="number" id="new_n_min" step="0.001" placeholder="Normal Min">
                    <input type="number" id="new_n_max" step="0.001" placeholder="Normal Max">
                </div>
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <input type="number" id="new_p_min" step="0.001" placeholder="Precision Min">
                    <input type="number" id="new_p_max" step="0.001" placeholder="Precision Max">
                </div>
                <button class="btn-save" onclick="addNewCoating()">บันทึก (Save)</button>
            </div>
        </div>
    </div>
</div>

<script>
    const defaultCoatings = [
        { name: "TiAlN", n: [0.004, 0.008], p: [0.002, 0.004] },
        { name: "Tin", n: [0.004, 0.008], p: [0.002, 0.004] },
        { name: "TiCN", n: [0.004, 0.008], p: [0.002, 0.004] },
        { name: "AlCrN", n: [0.004, 0.008], p: [0.002, 0.004] },
        { name: "CrN", n: [0.004, 0.008], p: [0.002, 0.004] },
        { name: "ACX", n: [0.004, 0.008], p: [0.002, 0.004] },
        { name: "DLC", n: [0.001, 0.003], p: [0.001, 0.003] },
        { name: "AC-DC Fine", n: [0.001, 0.003], p: [0.001, 0.003] },
        { name: "Alcrona Evo", n: [0.006, 0.010], p: [0.002, 0.004] },
        { name: "Alcrona Evo AV1", n: [0.002, 0.004], p: [0.002, 0.004] },
        { name: "Alcrona Evo AV3", n: [0.006, 0.010], p: [0.006, 0.010] },
        { name: "Durana", n: [0.002, 0.008], p: [0.002, 0.008] },
        { name: "Latuma", n: [0.002, 0.008], p: [0.002, 0.008] },
        { name: "Latuma LM1", n: [0.002, 0.004], p: [0.002, 0.004] },
        { name: "Latuma LM3", n: [0.006, 0.010], p: [0.006, 0.010] },
        { name: "Electroless Nickel", n: [0.006, 0.010], p: [0.006, 0.010] }
    ];

    let coatings = [];
    let lastUpdateDate = null;

    function init() {
        const savedData = localStorage.getItem('myCoatings_v6_data');
        const savedTime = localStorage.getItem('myCoatings_v6_time');
        coatings = savedData ? JSON.parse(savedData) : JSON.parse(JSON.stringify(defaultCoatings));
        lastUpdateDate = savedTime || new Date().toISOString();
        renderDropdown();
        updateMetaDisplay();
    }

    function renderDropdown() {
        const select = document.getElementById('coatingSelect');
        select.innerHTML = '';
        let placeholder = document.createElement("option");
        placeholder.value = ""; placeholder.text = "⚠️ กรุณาเลือกสาร Coating..."; placeholder.disabled = true; placeholder.selected = true;
        select.appendChild(placeholder);
        coatings.forEach((c, index) => {
            let option = document.createElement("option");
            option.value = index; option.text = c.name;
            select.appendChild(option);
        });
        select.classList.add('needs-attention');
    }

    function handleCoatingChange() {
        const select = document.getElementById('coatingSelect');
        if (select.value !== "") {
            select.classList.remove('needs-attention');
            calculate();
        }
    }

    function formatDisplay(num, forcePlus = false) {
        if (isNaN(num)) return "-";
        let val = Math.round(num * 1000) / 1000;
        let str = val.toFixed(3);
        return (forcePlus && val > 0) ? "+" + str : (val === 0 ? "0.000" : str);
    }

    function clearResults() {
        const ids = ['norm_neg_base','norm_neg_top','norm_neg_bot','norm_pos_base','norm_pos_top','norm_pos_bot',
                     'prec_neg_base','prec_neg_top','prec_neg_bot','prec_pos_base','prec_pos_top','prec_pos_bot'];
        ids.forEach(id => document.getElementById(id).innerText = "-");
        document.getElementById('statusDisplay').style.display = 'none';
    }

    function calculate() {
        const coatingIdx = document.getElementById('coatingSelect').value;
        const statusDiv = document.getElementById('statusDisplay');
        const colNormal = document.getElementById('colNormal');
        const colPrecision = document.getElementById('colPrecision');

        if (coatingIdx === "") {
            statusDiv.className = 'status-bar status-warn';
            statusDiv.innerHTML = "❌ โปรดเลือกประเภทสาร Coating ก่อน";
            statusDiv.style.display = 'block';
            return;
        }

        const baseDiaStr = document.getElementById('baseDia').value;
        const tolUpperStr = document.getElementById('tolUpper').value;
        const tolLowerStr = document.getElementById('tolLower').value;

        if (!baseDiaStr || !tolUpperStr || !tolLowerStr) {
            statusDiv.innerText = "รอข้อมูลขนาด..."; statusDiv.className = 'status-bar'; statusDiv.style.display = 'block';
            return;
        }

        const coating = coatings[coatingIdx];
        const baseDia = parseFloat(baseDiaStr);
        const tolUpper = parseFloat(tolUpperStr);
        const tolLower = parseFloat(tolLowerStr);
        const tolRange = Math.round((tolUpper - tolLower) * 1000) / 1000;

        document.getElementById('coatingRangeDisplay').innerHTML = 
            `<div><span style="color:#16a34a; font-weight:bold;">Normal:</span> ${coating.n[0]} - ${coating.n[1]}</div>
             <div><span style="color:#dc2626; font-weight:bold;">Precision:</span> ${coating.p[0]} - ${coating.p[1]}</div>`;

        statusDiv.style.display = 'block';
        colNormal.classList.remove('faded'); colPrecision.classList.remove('faded');
        
        let effectiveTolUpper = tolUpper;
        if (tolRange >= 0.05) {
            effectiveTolUpper = tolUpper - 0.01;
            statusDiv.className = 'status-bar status-wide';
            statusDiv.innerHTML = `สถานะ: Tolerance กว้าง (${tolRange.toFixed(3)})<br><span style="font-size:12px; font-weight:400;">ใช้ค่า Safety Margin -0.01 ที่ Max Tolerance</span>`;
            colPrecision.classList.add('faded');
        } else {
            if (tolRange >= 0.007) {
                statusDiv.className = 'status-bar status-ok';
                statusDiv.innerHTML = `สถานะการผลิต: สามารถผลิตได้ปกติ (Capable) <br><span style="font-size:12px; font-weight:400;">Tol Range: ${tolRange.toFixed(3)}</span>`;
            } else if (tolRange >= 0.005) {
                statusDiv.className = 'status-bar status-warn';
                statusDiv.innerHTML = `สถานะการผลิต: ต้องระวัง - แนะนำใช้ Precision (Caution) <br><span style="font-size:12px; font-weight:400;">Tol Range: ${tolRange.toFixed(3)}</span>`;
                colNormal.classList.add('faded');
            } else {
                statusDiv.className = 'status-bar status-err';
                statusDiv.innerHTML = `สถานะการผลิต: ไม่สามารถผลิตได้ (Impossible) <br><span style="font-size:12px; font-weight:400;">Tol Range: ${tolRange.toFixed(3)}</span>`;
                colNormal.classList.add('faded'); colPrecision.classList.add('faded');
            }
        }

        const runCalc = (c_min, c_max) => {
            let tMax = (baseDia + effectiveTolUpper) - c_max;
            let tMin = (baseDia + tolLower) - c_min;
            let rng = tMax - tMin;
            return { baseMax: tMax, baseMin: tMin, range: rng };
        };

        const n = runCalc(coating.n[0], coating.n[1]);
        document.getElementById('norm_neg_base').innerText = formatDisplay(n.baseMax);
        document.getElementById('norm_neg_top').innerText = "0.000";
        document.getElementById('norm_neg_bot').innerText = formatDisplay(-n.range);
        document.getElementById('norm_pos_base').innerText = formatDisplay(n.baseMin);
        document.getElementById('norm_pos_top').innerText = formatDisplay(n.range, true);
        document.getElementById('norm_pos_bot').innerText = "0.000";

        const p = runCalc(coating.p[0], coating.p[1]);
        document.getElementById('prec_neg_base').innerText = formatDisplay(p.baseMax);
        document.getElementById('prec_neg_top').innerText = "0.000";
        document.getElementById('prec_neg_bot').innerText = formatDisplay(-p.range);
        document.getElementById('prec_pos_base').innerText = formatDisplay(p.baseMin);
        document.getElementById('prec_pos_top').innerText = formatDisplay(p.range, true);
        document.getElementById('prec_pos_bot').innerText = "0.000";
    }

    function resetDefaults() {
        if(confirm("ล้างข้อมูลกลับเป็นค่าเริ่มต้นโรงงาน (16 สาร)?")) {
            localStorage.removeItem('myCoatings_v6_data');
            location.reload();
        }
    }

    function toggleAddForm() { const f = document.getElementById('addCoatingForm'); f.style.display = f.style.display==='none'?'block':'none'; }
    function updateMetaDisplay() { document.getElementById('countDisplay').innerText = `(${coatings.length})`; }
    function exportData() {
        const blob = new Blob([JSON.stringify({data:coatings, timestamp:new Date().toISOString()})], {type:"application/json"});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download=`CoatingData_${new Date().toISOString().slice(0,10)}.json`; a.click();
    }
    init();
</script>
</body>
</html>
