<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Coating Calculator</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --success-color: #10b981;
            --success-hover: #059669;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --warning-color: #f59e0b;
            --light-gray: #f8fafc;
            --medium-gray: #e2e8f0;
            --dark-gray: #475569;
            --white-color: #ffffff;
            --font-family: 'Inter', 'Prompt', sans-serif;
            --border-radius: 12px;
            --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --box-shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #334155;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .hidden { display: none !important; }

        .app-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--dark-gray);
            font-weight: 600;
            margin-bottom: 24px;
            font-family: 'Prompt', sans-serif;
        }

        .controls-header {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .btn-small {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--medium-gray);
            background: var(--white-color);
            color: var(--dark-gray);
            transition: all 0.2s;
        }
        .btn-small:hover { background: var(--light-gray); box-shadow: var(--box-shadow); }

        /* --- Layout --- */
        .calculator-wrapper {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap; 
            gap: 20px; 
            margin-bottom: 20px;
        }

        .calculator-card {
            flex: 1; 
            min-width: 300px;
            background: var(--white-color);
            padding: 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow-lg);
            display: flex;
            flex-direction: column;
        }

        .calculator-card h2 {
            margin-top: 0; 
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark-gray);
            border-bottom: 1px solid var(--medium-gray);
            padding-bottom: 12px;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* --- Forms & Inputs --- */
        .form-group { margin-bottom: 15px; }
        .form-group label { 
            display: flex; 
            justify-content: space-between;
            margin-bottom: 8px; 
            font-weight: 500; 
            color: var(--dark-gray);
            font-size: 0.95rem;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            font-size: 1rem;
            border: 1px solid var(--medium-gray);
            border-radius: 8px;
            background: var(--light-gray);
            transition: all 0.3s ease;
            outline: none;
            font-family: var(--font-family);
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: var(--white-color);
        }

        select { font-weight: 600; color: var(--primary-color); cursor: pointer; }

        /* Pulse Alert */
        @keyframes pulse-border {
            0% { border-color: var(--medium-gray); }
            50% { border-color: var(--primary-color); background-color: #eff6ff; }
            100% { border-color: var(--medium-gray); }
        }
        .needs-attention { animation: pulse-border 1.5s infinite; border-width: 2px; }

        .tol-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: var(--light-gray);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--medium-gray);
            margin-top: 10px;
        }
        .tol-grid .form-group { margin-bottom: 0; }
        .tol-grid label { font-size: 0.8rem; color: #64748b; }

        .info-box {
            background: #f1f5f9;
            border: 1px dashed #cbd5e1;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--dark-gray);
            margin-top: 15px;
        }

        /* --- Buttons --- */
        .btn {
            width: 100%;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-family: var(--font-family);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: var(--box-shadow); }
        .btn-primary { background: var(--primary-color); color: var(--white-color); }
        .btn-primary:hover { background: var(--primary-hover); }
        
        /* --- Results Area --- */
        .status-alert {
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
        }
        .status-ok { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .status-warn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .status-err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .status-wide { background: #f3e8ff; color: #6b21a8; border: 1px solid #d8b4fe; }

        .result-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .res-col {
            border: 1px solid var(--medium-gray);
            border-radius: 12px;
            overflow: hidden;
        }
        .res-col.faded { opacity: 0.35; pointer-events: none; filter: grayscale(100%); }

        .res-col-header {
            padding: 12px;
            text-align: center;
            color: white;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .bg-normal { background: var(--success-color); }
        .bg-precision { background: var(--danger-color); }

        .res-body { padding: 15px; background: var(--white-color); }

        .res-box {
            background: var(--light-gray);
            border: 1px solid var(--medium-gray);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }
        .res-box:last-child { margin-bottom: 0; }
        
        .res-label { font-size: 0.75rem; color: #64748b; margin-bottom: 8px; font-weight: 600; }
        
        .drawing-flex {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .draw-dia { font-size: 1.8rem; font-weight: 700; color: #1e293b; line-height: 1; }
        .draw-tol { display: flex; flex-direction: column; font-size: 0.9rem; font-weight: 600; text-align: left; color: #475569; }

        /* Add Form */
        .add-form {
            background: var(--light-gray);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--medium-gray);
            margin-top: 20px;
            display: none;
        }
        .add-form .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

        /* --- Responsive Mobile --- */
        @media (max-width: 800px) {
            .calculator-wrapper { flex-direction: column; }
            .calculator-card { min-width: 100%; }
            .result-columns { grid-template-columns: 1fr; }
            
            /* ปรับขนาดตัวอักษรผลลัพธ์ในมือถือให้ไม่ล้น */
            .draw-dia { font-size: 1.5rem; }
            .draw-tol { font-size: 0.8rem; }
            .res-box { padding: 12px 10px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1><i class="fas fa-shield-alt"></i> Pre-Coating Calculator</h1>

    <div class="controls-header">
        <button class="btn-small" onclick="resetDefaults()" title="ล้างค่าทั้งหมด">
            <i class="fas fa-undo"></i> Reset
        </button>
        <button class="btn-small" onclick="exportData()" title="ส่งออกไฟล์ข้อมูล">
            <i class="fas fa-download"></i>
        </button>
        <button class="btn-small" onclick="document.getElementById('fileInput').click()" title="นำเข้าไฟล์ข้อมูล">
            <i class="fas fa-upload"></i>
        </button>
        <input type="file" id="fileInput" style="display: none" accept=".json" onchange="importData(this)">
    </div>

    <div class="calculator-wrapper">
        <div class="calculator-card">
            <h2><i class="fas fa-edit"></i> ข้อมูลชิ้นงาน</h2>
            
            <div class="form-group">
                <label>
                    <span>เลือกสาร Coating <span id="countDisplay" style="color:var(--primary-color); font-size:0.8rem;">(0)</span></span>
                    <button id="btnDelete" onclick="deleteCurrentCoating()" style="background:none; border:none; color:var(--danger-color); cursor:pointer; font-size:0.85rem; display:none;">ลบสารนี้</button>
                </label>
                <select id="coatingSelect" onchange="handleCoatingChange()" class="needs-attention"></select>
                <div id="coatingRangeDisplay" class="info-box" style="text-align:center;">
                    ⚠️ กรุณาเลือกสาร Coating ก่อน
                </div>
            </div>

            <div class="form-group" style="margin-top:20px;">
                <label for="baseDia">Target Dia (เส้นผ่านศูนย์กลาง)</label>
                <input type="number" id="baseDia" step="0.001" placeholder="เช่น 10.00" oninput="calculate()" style="font-size:1.2rem; font-weight:bold;">
            </div>

            <div class="tol-grid">
                <div class="form-group">
                    <label for="tolUpper">Max Tolerance (+)</label>
                    <input type="number" id="tolUpper" step="0.001" placeholder="0.020" oninput="calculate()">
                </div>
                <div class="form-group">
                    <label for="tolLower">Min Tolerance (-)</label>
                    <input type="number" id="tolLower" step="0.001" placeholder="-0.010" oninput="calculate()">
                </div>
            </div>
            
            <button onclick="toggleAddForm()" style="background:none; border:none; color:var(--primary-color); text-decoration:underline; cursor:pointer; margin-top:20px; font-size:0.9rem; text-align:left;">
                + เพิ่มข้อมูลสาร Coating ใหม่
            </button>

            <div id="addCoatingForm" class="add-form">
                <div class="form-group">
                    <input type="text" id="new_name" placeholder="ชื่อสาร (Name)">
                </div>
                <label style="font-size:0.8rem; color:var(--dark-gray);">Normal Range (Min - Max)</label>
                <div class="grid-2">
                    <input type="number" id="new_n_min" step="0.001" placeholder="Min">
                    <input type="number" id="new_n_max" step="0.001" placeholder="Max">
                </div>
                <label style="font-size:0.8rem; color:var(--dark-gray);">Precision Range (Min - Max)</label>
                <div class="grid-2">
                    <input type="number" id="new_p_min" step="0.001" placeholder="Min">
                    <input type="number" id="new_p_max" step="0.001" placeholder="Max">
                </div>
                <button class="btn btn-primary" onclick="addNewCoating()" style="padding:8px;">บันทึกข้อมูล</button>
            </div>

        </div>

        <div class="calculator-card">
            <h2><i class="fas fa-chart-bar"></i> ผลการคำนวณ</h2>
            
            <div id="statusDisplay" class="status-alert">รอข้อมูล...</div>

            <div class="result-columns">
                <div class="res-col" id="colNormal">
                    <div class="res-col-header bg-normal">Normal Type</div>
                    <div class="res-body">
                        <div class="res-box">
                            <div class="res-label">TARGET: MIN (TOL -)</div>
                            <div class="drawing-flex">
                                <div class="draw-dia" id="norm_neg_base">-</div>
                                <div class="draw-tol">
                                    <div id="norm_neg_top">-</div>
                                    <div id="norm_neg_bot">-</div>
                                </div>
                            </div>
                        </div>
                        <div class="res-box">
                            <div class="res-label">TARGET: MAX (TOL +)</div>
                            <div class="drawing-flex">
                                <div class="draw-dia" id="norm_pos_base">-</div>
                                <div class="draw-tol">
                                    <div id="norm_pos_top">-</div>
                                    <div id="norm_pos_bot">-</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="res-col" id="colPrecision">
                    <div class="res-col-header bg-precision">Precision Type</div>
                    <div class="res-body">
                        <div class="res-box">
                            <div class="res-label">TARGET: MIN (TOL -)</div>
                            <div class="drawing-flex">
                                <div class="draw-dia" id="prec_neg_base">-</div>
                                <div class="draw-tol">
                                    <div id="prec_neg_top">-</div>
                                    <div id="prec_neg_bot">-</div>
                                </div>
                            </div>
                        </div>
                        <div class="res-box">
                            <div class="res-label">TARGET: MAX (TOL +)</div>
                            <div class="drawing-flex">
                                <div class="draw-dia" id="prec_pos_base">-</div>
                                <div class="draw-tol">
                                    <div id="prec_pos_top">-</div>
                                    <div id="prec_pos_bot">-</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div style="text-align:center; font-size:0.75rem; color:#94a3b8; margin-top:15px; font-style:italic;">
                *ค่าที่แสดงคือขนาดก่อนส่งชุบ (Subtract coating thickness)
            </div>
        </div>
    </div>
</div>

<script>
    const defaultCoatings = [
        { name: "TiAlN", n: [0.004, 0.008], p: [0.002, 0.004] },
        { name: "Tin", n: [0.004, 0.008], p: [0.002, 0.004] },
        { name: "TiCN", n: [0.004, 0.008], p: [0.002, 0.004] },
        { name: "AlCrN", n: [0.004, 0.008], p: [0.002, 0.004] },
        { name: "CrN", n: [0.004, 0.008], p: [0.002, 0.004] },
        { name: "ACX", n: [0.004, 0.008], p: [0.002, 0.004] },
        { name: "DLC", n: [0.001, 0.003], p: [0.001, 0.003] },
        { name: "AC-DC Fine", n: [0.001, 0.003], p: [0.001, 0.003] },
        { name: "Alcrona Evo", n: [0.006, 0.010], p: [0.002, 0.004] },
        { name: "Alcrona Evo AV1", n: [0.002, 0.004], p: [0.002, 0.004] },
        { name: "Alcrona Evo AV3", n: [0.006, 0.010], p: [0.006, 0.010] },
        { name: "Durana", n: [0.002, 0.008], p: [0.002, 0.008] },
        { name: "Latuma", n: [0.002, 0.008], p: [0.002, 0.008] },
        { name: "Latuma LM1", n: [0.002, 0.004], p: [0.002, 0.004] },
        { name: "Latuma LM3", n: [0.006, 0.010], p: [0.006, 0.010] },
        { name: "Electroless Nickel", n: [0.006, 0.010], p: [0.006, 0.010] }
    ];

    let coatings = [];

    function init() {
        const savedData = localStorage.getItem('myCoatings_v6_data');
        coatings = savedData ? JSON.parse(savedData) : JSON.parse(JSON.stringify(defaultCoatings));
        renderDropdown();
    }

    function renderDropdown() {
        const select = document.getElementById('coatingSelect');
        select.innerHTML = '';
        let placeholder = document.createElement("option");
        placeholder.value = ""; placeholder.text = "-- กรุณาเลือกสาร Coating --"; placeholder.disabled = true; placeholder.selected = true;
        select.appendChild(placeholder);
        coatings.forEach((c, index) => {
            let option = document.createElement("option");
            option.value = index; option.text = c.name;
            select.appendChild(option);
        });
        select.classList.add('needs-attention');
        document.getElementById('countDisplay').innerText = `(${coatings.length})`;
    }

    function handleCoatingChange() {
        const select = document.getElementById('coatingSelect');
        const btnDelete = document.getElementById('btnDelete');
        if (select.value !== "") {
            select.classList.remove('needs-attention');
            btnDelete.style.display = 'inline-block';
            calculate();
        } else {
            btnDelete.style.display = 'none';
        }
    }

    function formatDisplay(num, forcePlus = false) {
        if (isNaN(num)) return "-";
        let val = Math.round(num * 1000) / 1000;
        let str = val.toFixed(3);
        return (forcePlus && val > 0) ? "+" + str : (val === 0 ? "0.000" : str);
    }

    function clearResults() {
        const ids = ['norm_neg_base','norm_neg_top','norm_neg_bot','norm_pos_base','norm_pos_top','norm_pos_bot',
                     'prec_neg_base','prec_neg_top','prec_neg_bot','prec_pos_base','prec_pos_top','prec_pos_bot'];
        ids.forEach(id => document.getElementById(id).innerText = "-");
        document.getElementById('statusDisplay').style.display = 'none';
    }

    function calculate() {
        const coatingIdx = document.getElementById('coatingSelect').value;
        const statusDiv = document.getElementById('statusDisplay');
        const colNormal = document.getElementById('colNormal');
        const colPrecision = document.getElementById('colPrecision');

        if (coatingIdx === "") {
            clearResults();
            statusDiv.className = 'status-alert status-warn';
            statusDiv.innerHTML = "โปรดเลือกสาร Coating ก่อน";
            statusDiv.style.display = 'block';
            return;
        }

        const baseDiaStr = document.getElementById('baseDia').value;
        const tolUpperStr = document.getElementById('tolUpper').value;
        const tolLowerStr = document.getElementById('tolLower').value;

        if (!baseDiaStr || !tolUpperStr || !tolLowerStr) {
            clearResults();
            statusDiv.innerText = "กรอกข้อมูลขนาดให้ครบเพื่อคำนวณ"; 
            statusDiv.className = 'status-alert'; 
            statusDiv.style.display = 'block';
            return;
        }

        const coating = coatings[coatingIdx];
        const baseDia = parseFloat(baseDiaStr);
        const tolUpper = parseFloat(tolUpperStr);
        const tolLower = parseFloat(tolLowerStr);
        const tolRange = Math.round((tolUpper - tolLower) * 1000) / 1000;

        document.getElementById('coatingRangeDisplay').innerHTML = 
            `<div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                <span><i class="fas fa-check-circle" style="color:var(--success-color);"></i> Normal:</span> <strong>${coating.n[0]} - ${coating.n[1]}</strong>
             </div>
             <div style="display:flex; justify-content:space-between;">
                <span><i class="fas fa-bullseye" style="color:var(--danger-color);"></i> Precision:</span> <strong>${coating.p[0]} - ${coating.p[1]}</strong>
             </div>`;
        document.getElementById('coatingRangeDisplay').style.textAlign = 'left';

        statusDiv.style.display = 'block';
        colNormal.classList.remove('faded'); colPrecision.classList.remove('faded');
        
        let effectiveTolUpper = tolUpper;
        if (tolRange >= 0.05) {
            effectiveTolUpper = tolUpper - 0.01;
            statusDiv.className = 'status-alert status-wide';
            statusDiv.innerHTML = `Tolerance กว้าง (${tolRange.toFixed(3)})<br><span style="font-size:12px; font-weight:normal;">ใช้ค่า Safety -0.01 ที่ Max</span>`;
            colPrecision.classList.add('faded');
        } else {
            if (tolRange >= 0.007) {
                statusDiv.className = 'status-alert status-ok';
                statusDiv.innerHTML = `สามารถผลิตได้ (Capable) <br><span style="font-size:12px; font-weight:normal;">Tol Range: ${tolRange.toFixed(3)}</span>`;
            } else if (tolRange >= 0.005) {
                statusDiv.className = 'status-alert status-warn';
                statusDiv.innerHTML = `ต้องระวัง - แนะนำใช้ Precision <br><span style="font-size:12px; font-weight:normal;">Tol Range: ${tolRange.toFixed(3)}</span>`;
                colNormal.classList.add('faded');
            } else {
                statusDiv.className = 'status-alert status-err';
                statusDiv.innerHTML = `ไม่สามารถผลิตได้ (Impossible) <br><span style="font-size:12px; font-weight:normal;">Tol Range: ${tolRange.toFixed(3)}</span>`;
                colNormal.classList.add('faded'); colPrecision.classList.add('faded');
            }
        }

        const runCalc = (c_min, c_max) => {
            let tMax = (baseDia + effectiveTolUpper) - c_max;
            let tMin = (baseDia + tolLower) - c_min;
            let rng = tMax - tMin;
            return { baseMax: tMax, baseMin: tMin, range: rng };
        };

        const n = runCalc(coating.n[0], coating.n[1]);
        document.getElementById('norm_neg_base').innerText = formatDisplay(n.baseMax);
        document.getElementById('norm_neg_top').innerText = "0.000";
        document.getElementById('norm_neg_bot').innerText = formatDisplay(-n.range);
        document.getElementById('norm_pos_base').innerText = formatDisplay(n.baseMin);
        document.getElementById('norm_pos_top').innerText = formatDisplay(n.range, true);
        document.getElementById('norm_pos_bot').innerText = "0.000";

        const p = runCalc(coating.p[0], coating.p[1]);
        document.getElementById('prec_neg_base').innerText = formatDisplay(p.baseMax);
        document.getElementById('prec_neg_top').innerText = "0.000";
        document.getElementById('prec_neg_bot').innerText = formatDisplay(-p.range);
        document.getElementById('prec_pos_base').innerText = formatDisplay(p.baseMin);
        document.getElementById('prec_pos_top').innerText = formatDisplay(p.range, true);
        document.getElementById('prec_pos_bot').innerText = "0.000";
    }

    function toggleAddForm() { 
        const f = document.getElementById('addCoatingForm'); 
        f.style.display = f.style.display==='block' ? 'none' : 'block'; 
    }
    
    function resetDefaults() {
        if(confirm("ล้างข้อมูลกลับเป็นค่าเริ่มต้นโรงงาน (16 สาร)?")) {
            localStorage.removeItem('myCoatings_v6_data');
            location.reload();
        }
    }

    function exportData() {
        const blob = new Blob([JSON.stringify({data:coatings})], {type:"application/json"});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download=`CoatingData.json`; a.click();
    }
    
    function deleteCurrentCoating() {
        const idx = document.getElementById('coatingSelect').value;
        if(idx !== "" && confirm(`ยืนยันการลบ "${coatings[idx].name}"?`)) {
            coatings.splice(idx, 1);
            localStorage.setItem('myCoatings_v6_data', JSON.stringify(coatings));
            renderDropdown();
            clearResults();
            document.getElementById('btnDelete').style.display = 'none';
            document.getElementById('coatingRangeDisplay').innerHTML = '⚠️ กรุณาเลือกสาร Coating ก่อน';
        }
    }
    
    function addNewCoating() {
        const name = document.getElementById('new_name').value;
        const n_min = parseFloat(document.getElementById('new_n_min').value);
        const n_max = parseFloat(document.getElementById('new_n_max').value);
        const p_min = parseFloat(document.getElementById('new_p_min').value);
        const p_max = parseFloat(document.getElementById('new_p_max').value);
        if (!name || isNaN(n_min) || isNaN(n_max) || isNaN(p_min) || isNaN(p_max)) {
            alert("กรุณากรอกข้อมูลให้ครบทุกช่อง"); return;
        }
        coatings.push({ name: name, n: [n_min, n_max], p: [p_min, p_max] });
        localStorage.setItem('myCoatings_v6_data', JSON.stringify(coatings));
        renderDropdown();
        document.getElementById('coatingSelect').value = coatings.length - 1;
        handleCoatingChange();
        toggleAddForm();
    }

    init();
</script>
</body>
</html>
