<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Engineering Tools Suite</title>
    
    <script src="tailwindcss.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --sidebar-bg: #0f172a;
            --sidebar-hover: #1e293b;
            --accent: #38bdf8;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f1f5f9; height: 100vh; overflow: hidden; font-family: 'Inter', 'Prompt', sans-serif; display: flex; position: relative; }

        /* =========================================
           HOME SCREEN (DASHBOARD)
           ========================================= */
        .home-screen {
            position: fixed; inset: 0; z-index: 2000;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            overflow-y: auto; display: flex; flex-direction: column; align-items: center;
            padding: 60px 20px;
            transition: opacity 0.4s ease, visibility 0.4s ease, transform 0.4s ease;
        }
        
        .home-screen.hidden { 
            opacity: 0; visibility: hidden; pointer-events: none; 
            transform: scale(1.05);
        }

        .home-header { text-align: center; margin-bottom: 40px; color: white; animation: fadeInDown 0.6s ease; }
        .home-header h1 { font-size: 2.5rem; font-weight: 600; color: var(--accent); margin-bottom: 10px; font-family: 'Prompt', sans-serif;}
        .home-header p { color: var(--text-muted); font-size: 1.1rem; }

        .home-search {
            width: 100%; max-width: 600px; margin: 0 auto 40px;
            position: relative; animation: fadeInUp 0.6s ease;
        }
        .home-search i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 1.2rem; }
        .home-search input {
            width: 100%; padding: 18px 20px 18px 50px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: white; outline: none; font-size: 1.1rem;
            backdrop-filter: blur(10px); transition: all 0.3s;
        }
        .home-search input:focus { background: rgba(255,255,255,0.1); border-color: var(--accent); box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }

        .home-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px; width: 100%; max-width: 1100px; animation: fadeInUp 0.8s ease;
        }

        .home-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; padding: 30px 20px; text-align: center; cursor: pointer;
            transition: all 0.3s ease; backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .home-card:hover {
            background: rgba(56, 189, 248, 0.08); border-color: rgba(56, 189, 248, 0.3);
            transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .card-icon { font-size: 2.8rem; color: var(--accent); margin-bottom: 15px; }
        .card-title { color: white; font-weight: 500; font-size: 1.1rem; font-family: 'Prompt', sans-serif;}

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }


        /* =========================================
           APP LAYOUT (SIDEBAR & IFRAME)
           ========================================= */
        .sidebar {
            position: fixed; top: 0; left: -320px; width: 280px; height: 100%;
            background: var(--sidebar-bg); color: var(--text-main);
            display: flex; flex-direction: column; z-index: 1000;
            transition: left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.2);
        }
        .sidebar.active { left: 0; }
        
        .logo {
            padding: 24px 20px; font-size: 1.2rem; font-weight: 600; color: var(--accent);
            background: linear-gradient(to bottom, #0f172a, #131c31);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: space-between;
        }

        .search-box { padding: 15px 20px; }
        .search-wrapper { position: relative; background: #1e293b; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .search-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; }
        .search-input { width: 100%; padding: 10px 10px 10px 35px; border: none; background: transparent; color: white; outline: none; font-size: 0.9rem; }

        .menu-list { flex: 1; overflow-y: auto; padding: 10px 15px; }
        .menu-list::-webkit-scrollbar { width: 4px; }
        .menu-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .menu-item {
            padding: 12px 15px; margin-bottom: 6px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; gap: 12px; color: var(--text-muted);
            transition: all 0.2s ease; font-size: 0.95rem; border-left: 3px solid transparent;
        }
        .menu-item:hover { background: var(--sidebar-hover); color: white; transform: translateX(3px); }
        .menu-item.active { background: rgba(56, 189, 248, 0.1); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
        .menu-item i { width: 24px; text-align: center; font-size: 1.1rem; }

        .main-content { flex: 1; height: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; display: block; background: #f1f5f9;}

        @media (min-width: 1024px) {
            .sidebar { left: 0; }
            .main-content { margin-left: 280px; }
            .btn-mobile, .overlay { display: none !important; }
        }

        .btn-mobile {
            position: fixed; top: 20px; left: 20px; z-index: 900;
            background: rgba(15, 23, 42, 0.9); color: white; padding: 10px 16px;
            border-radius: 10px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            backdrop-filter: blur(8px); display: flex; align-items: center; gap: 8px;
        }
        
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 998;
            opacity: 0; visibility: hidden; transition: 0.3s; backdrop-filter: blur(4px);
        }
        .overlay.active { opacity: 1; visibility: visible; }

        /* =========================================
           MOBILE RESPONSIVE TWEAKS (2 Columns on Mobile)
           ========================================= */
        @media (max-width: 600px) {
            .home-screen {
                padding: 40px 15px; 
            }
            .home-header h1 {
                font-size: 1.8rem;
            }
            .home-header p {
                font-size: 0.95rem;
            }
            .home-grid {
                /* บังคับให้เป็น 2 คอลัมน์เสมอในมือถือ */
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .home-card {
                padding: 20px 10px;
                border-radius: 12px;
            }
            .card-icon {
                font-size: 2rem; /* ปรับขนาดไอคอนลงเล็กน้อย */
                margin-bottom: 10px;
            }
            .card-title {
                font-size: 0.85rem; /* ปรับขนาดฟอนต์ให้พอดีบรรทัด */
                line-height: 1.3;
            }
        }
    </style>
</head>
<body>

    <div id="homeScreen" class="home-screen">
        <div class="home-header">
            <h1><i class="fas fa-drafting-compass text-sky-400 mr-2"></i> Engineering Tools</h1>
            <p>รวมเครื่องมือคำนวณสำหรับวิศวกรและช่างเทคนิค</p>
        </div>

        <div class="home-search">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="ค้นหาโปรแกรมที่ต้องการ..." onkeyup="filterHome(this.value)">
        </div>

        <div class="home-grid" id="homeGrid"></div>
    </div>


    <div class="overlay" onclick="toggleNav(false)"></div>
    
    <button class="btn-mobile" onclick="toggleNav(true)">
        <i class="fas fa-bars"></i> <span>เมนู</span>
    </button>

    <nav class="sidebar" id="sidebar">
        <div class="logo">
            <span class="cursor-pointer" onclick="goHome()" title="กลับหน้าแรก">
                <i class="fas fa-home text-white mr-2 hover:text-sky-400 transition"></i> Tools Suite
            </span>
            <i class="fas fa-times lg:hidden cursor-pointer text-slate-500" onclick="toggleNav(false)"></i>
        </div>
        
        <div class="search-box">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" class="search-input" placeholder="ค้นหาเครื่องมือ..." onkeyup="filterMenu(this.value)">
            </div>
        </div>

        <div class="menu-list" id="menuList">
            <div class="menu-item" onclick="goHome()" style="color: white; border-bottom: 1px solid #334155; margin-bottom: 15px; padding-bottom: 15px;">
                <i class="fas fa-home"></i> กลับหน้าแรก (Home)
            </div>

            <div class="menu-item" onclick="loadTool(this, 'programs/coating.html')">
                <i class="fas fa-layer-group"></i> Coating
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/lead.html')">
                <i class="fas fa-hurricane"></i> Lead
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/copypaste.html')">
                <i class="fas fa-copy"></i> Copy & Paste
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/unit-converter.html')">
                <i class="fas fa-exchange-alt"></i> Unit Converter
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/tolerance.html')">
                <i class="fas fa-ruler-combined"></i> Tolerance
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/rrc.html')">
                <i class="fas fa-circle-notch"></i> RRC
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/runout-lipheight.html')">
                <i class="fas fa-arrows-spin"></i> Run out & Lip Height
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/oil-hole-ratio.html')">
                <i class="fas fa-percent"></i> Oil Hole Ratio
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/vcut-pattern-selector.html')">
                <i class="fas fa-cut"></i> V-Cut Selector
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/cutcon.html')">
                <i class="fas fa-calculator"></i> Cutting Calculator
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/oil-hole-endmill.html')">
                <i class="fas fa-bore-hole"></i> Oil Hole Endmill
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/oil-hole-spiral-angle.html')">
                <i class="fas fa-tornado"></i> Oil Hole Spiral Angle
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/yakibame.html')">
                <i class="fas fa-fire"></i> Yakibame
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/geometry.html')">
                <i class="fas fa-shapes"></i> Geometry & Trig
            </div>
            <div class="menu-item" onclick="loadTool(this, 'programs/cylinder-weight-calculator.html')">
                <i class="fas fa-weight-hanging"></i> Cylinder Weight
            </div>
        </div>
    </nav>

    <main class="main-content">
        <iframe id="appFrame" src=""></iframe>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.querySelector('.overlay');
        const homeScreen = document.getElementById('homeScreen');
        const appFrame = document.getElementById('appFrame');

        function generateHomeGrid() {
            const grid = document.getElementById('homeGrid');
            const items = document.querySelectorAll('.menu-list .menu-item');
            
            items.forEach((item, index) => {
                if(item.innerText.includes('กลับหน้าแรก')) return;

                const itemId = 'menu-item-' + index;
                item.id = itemId;
                
                const iconHtml = item.querySelector('i').outerHTML;
                const title = item.innerText.trim();
                
                const onclickAttr = item.getAttribute('onclick');
                const pathMatch = onclickAttr.match(/'([^']+)'/);
                const path = pathMatch ? pathMatch[1] : '';

                const card = document.createElement('div');
                card.className = 'home-card';
                card.onclick = () => {
                    loadTool(document.getElementById(itemId), path);
                };
                
                card.innerHTML = `
                    <div class="card-icon">${iconHtml}</div>
                    <div class="card-title">${title}</div>
                `;
                grid.appendChild(card);
            });
        }

        function loadTool(element, path) {
            appFrame.src = path;
            
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            if (window.innerWidth < 1024) toggleNav(false);

            homeScreen.classList.add('hidden');
        }

        function goHome() {
            homeScreen.classList.remove('hidden');
            appFrame.src = ''; 
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            if (window.innerWidth < 1024) toggleNav(false);
        }

        function toggleNav(isOpen) {
            sidebar.classList.toggle('active', isOpen);
            overlay.classList.toggle('active', isOpen);
        }

        function filterMenu(query) {
            const filter = query.toUpperCase();
            document.querySelectorAll("#menuList .menu-item").forEach(item => {
                if(item.innerText.includes('กลับหน้าแรก')) return; 
                const text = item.innerText.toUpperCase();
                item.style.display = text.includes(filter) ? "flex" : "none";
            });
        }

        function filterHome(query) {
            const filter = query.toUpperCase();
            document.querySelectorAll(".home-card").forEach(card => {
                const text = card.innerText.toUpperCase();
                card.style.display = text.includes(filter) ? "flex" : "none";
            });
        }

        window.addEventListener('load', () => {
            generateHomeGrid();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(console.error);
            });
        }
    </script>
</body>
</html>
